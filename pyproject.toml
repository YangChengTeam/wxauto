[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxauto-gateway"
version = "0.1.0"
description = "Windows WeChat automation gateway for 劳小智 recruiting"
requires-python = ">=3.10"
# emoji / pillow / pycaw / sounddevice / soundfile 是 vendored third_party/pywechat
# (pyweixin) 的运行时依赖，本仓代码不直接 import，**别按「没人引用」删掉**。
dependencies = [
  "emoji>=2.14.1",
  "pillow>=10.4.0",
  "psutil>=5.9.5",
  "comtypes>=1.4.0; platform_system == 'Windows'",
  "pyautogui>=0.9.54",
  "pycaw>=20240210; platform_system == 'Windows'",
  "pydantic-settings>=2.0",
  "pywin32>=308; platform_system == 'Windows'",
  "pywin32-ctypes>=0.2.2; platform_system == 'Windows'",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "structlog>=24.1",
  "sounddevice>=0.5.1",
  "soundfile>=0.13.1",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "websockets>=13",
]

[project.scripts]
wxclient-gateway = "wxclient.gateway.__main__:main"

[project.optional-dependencies]
# 打成单体 exe 的依赖。原 MCP onefile 构建脚本已随 MCP 入口一并删除；
# 网关的 exe 打包尚未做，这个 extra 先留着（见 README「打包」）。
build = [
  "PyInstaller>=6.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wxclient*"]
