[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxauto-gateway"
# 版本号唯一来源是 `wxclient/__init__.py` 的 __version__（`packaging/build.py` 也这么读）。
# 早先这里另写死了一份 0.1.0，25 次发版没人跟着改——到 0.1.26 时装出来的包元数据还写着 0.1.0。
dynamic = ["version"]
description = "Windows WeChat automation gateway for 劳小智 recruiting"
requires-python = ">=3.10"
# emoji / pillow / pycaw / sounddevice / soundfile 是 vendored third_party/pywechat
# (pyweixin) 的运行时依赖，本仓代码不直接 import，**别按「没人引用」删掉**。
dependencies = [
  "emoji>=2.14.1",
  "pillow>=10.4.0",
  "psutil>=5.9.5",
  "pystray>=0.19.5",
  "comtypes>=1.4.0; platform_system == 'Windows'",
  "pyautogui>=0.9.54",
  "pycaw>=20240210; platform_system == 'Windows'",
  "pydantic-settings>=2.0",
  "pywin32>=308; platform_system == 'Windows'",
  "pywin32-ctypes>=0.2.2; platform_system == 'Windows'",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  # vendored 的 pyweixin（third_party/pywechat/）要 `packaging.version`，而它不在任何
  # 依赖图里——不装的话微信 API 直接不可用。★ 报错还会长得莫名其妙：仓库根有个同名的
  # `packaging/` 目录（构建脚本），真包缺席时它就顶上成了命名空间包，于是错误是
  # 「cannot import name 'version' from 'packaging' (unknown location)」而不是「没装」。
  # 2026-08-19 真机实测：装上就好，命名空间包不会盖住真包（后者是常规包，优先）。
  "packaging>=23.0",
  "structlog>=24.1",
  "sounddevice>=0.5.1",
  "soundfile>=0.13.1",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "websockets>=13",
  # 本地库入站（wxclient/wechat_db/）：群消息正文是 zstd 压的，解它要用。
  "zstandard>=0.22",
  # 本地库入站解密：SQLCipher 页校验/解密（PBKDF2-HMAC-SHA512 + AES-CBC）靠它。
  # wechat_db 顶层就 import，漏装会让入站 attach 直接失败、静默回退 UIA——干净机器上必现。
  "cryptography>=42",
]

[tool.setuptools.dynamic]
version = { attr = "wxclient.__version__" }

[project.scripts]
wxclient-gateway = "wxclient.gateway.__main__:main"
wxclient-ui = "wxclient.ui.__main__:main"

[project.optional-dependencies]
# 打安装包要的依赖（`packaging/build.py`，见 README「打包」）。
# 只在打包机上装：`pip install -e ".[build]"`。装 Inno Setup 6 是另一件事，pip 管不着。
build = [
  "PyInstaller>=6.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wxclient*"]

[tool.ruff.lint.per-file-ignores]
# 打包脚本要先把仓库根塞进 sys.path，才能 `from wxclient.ui import theme`——
# 它们是拿 `python packaging/xxx.py` 直接跑的，不是被 import 的模块，没有别的办法。
# 所以这两个文件里 import 必然排在那行 sys.path.insert 后面（E402）。
"packaging/*.py" = ["E402"]
