[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxauto-mcp"
version = "0.1.0"
description = "Remote MCP server for Windows WeChat UI automation"
requires-python = ">=3.10"
dependencies = [
  "emoji>=2.14.1",
  "mcp>=1.26,<2",
  "pillow>=10.4.0",
  "psutil>=5.9.5",
  "comtypes>=1.4.0; platform_system == 'Windows'",
  "pyautogui>=0.9.54",
  "pycaw>=20240210; platform_system == 'Windows'",
  "pydantic-settings>=2.0",
  "pywin32>=308; platform_system == 'Windows'",
  "pywin32-ctypes>=0.2.2; platform_system == 'Windows'",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "structlog>=24.1",
  "sounddevice>=0.5.1",
  "soundfile>=0.13.1",
  "SQLAlchemy>=2.0",
]

[project.scripts]
wxclient-mcp = "wxclient.mcp_server.__main__:main"

[project.optional-dependencies]
build = [
  "PyInstaller>=6.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wxclient*"]

[tool.setuptools.package-data]
wxclient = ["mcp_server/assets/*"]
